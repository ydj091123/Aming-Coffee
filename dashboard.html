<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aming Coffee Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#2C1810}
.header{background:linear-gradient(135deg,#6F4E37,#5A3D2A);color:#fff;padding:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.logo-small{width:50px;height:50px;border-radius:50%;object-fit:cover}
.user-info{text-align:right}
.user-name{font-size:16px;font-weight:700}
.user-role{font-size:12px;opacity:.9;padding:4px 8px;background:rgba(255,255,255,.2);border-radius:4px;display:inline-block;margin-top:4px}
.btn-logout{background:#B85C50;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;margin-top:8px}
.nav-tabs{display:flex;gap:8px;padding:12px;background:#fff;overflow-x:auto;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.tab{padding:12px 20px;background:#f5f5f5;border:none;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s}
.tab.active{background:#6F4E37;color:#fff}
.container{padding:16px;max-width:1200px;margin:0 auto}
.view{display:none}
.view.active{display:block}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#6F4E37}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:6px;color:#6F4E37}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px;border:2px solid #D4C4B0;border-radius:8px;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:0;border-color:#6F4E37}
.btn-submit{background:#6F4E37;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.btn-add{background:#5A8F5A;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;margin-bottom:16px}
.loading{text-align:center;padding:40px;color:#8B6F47}
.empty-state{text-align:center;padding:40px;color:#8B6F47}
.task-item{background:#f9f9f9;padding:12px;border-radius:8px;margin-bottom:12px;border-left:4px solid #6F4E37}
.task-item input[type=checkbox]{margin-right:10px}
.task-title{font-weight:600;font-size:14px}
.task-meta{font-size:12px;color:#666;margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:linear-gradient(135deg,#6F4E37,#5A3D2A);color:#fff;padding:20px;border-radius:12px;text-align:center}
.stat-value{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-label{font-size:13px;opacity:.9}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
.modal.active{display:flex}
.modal-content{background:#fff;padding:24px;border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;color:#6F4E37}
.modal-close{background:#B85C50;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-top:12px}
.camera-container{position:relative;width:100%;max-width:400px;margin:0 auto}
.camera-container video,.camera-container img{width:100%;border-radius:12px;background:#000}
.camera-controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.camera-controls button{flex:1;min-width:120px}
.filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-row select,.filter-row input{flex:1;min-width:150px}
.announcement-item{background:#f9f9f9;padding:16px;border-radius:8px;margin-bottom:12px;border-left:4px solid #6F4E37}
.announcement-urgent{border-left-color:#B85C50}
.announcement-title{font-weight:700;margin-bottom:8px}
.announcement-content{color:#444;line-height:1.5;margin-bottom:8px}
.announcement-meta{font-size:12px;color:#888}
.priority-badge{display:inline-block;padding:4px 8px;border-radius:4px;font-size:11px;font-weight:700;margin-left:8px}
.priority-urgent{background:#B85C50;color:#fff}
.priority-normal{background:#D4A574;color:#fff}
.priority-info{background:#6F8FAF;color:#fff}
.photo-preview{max-width:100%;border-radius:8px;margin:12px 0}
.date-range{display:none;gap:10px;margin-top:10px}
.date-range.active{display:flex}
.role-badge{display:inline-block;padding:2px 6px;background:#D4A574;color:#fff;border-radius:4px;font-size:10px;margin-left:6px}
@media(max-width:768px){
.nav-tabs{gap:6px;padding:8px}
.tab{padding:10px 14px;font-size:13px}
.stats-grid{grid-template-columns:repeat(2,1fr)}
.filter-row{flex-direction:column}
.camera-controls{flex-direction:column}
.camera-controls button{width:100%}
}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:12px">
<img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QCMRXhpZgAATU0AKgAAAAgABQESAAMAAAABAAEAAAEaAAUAAAABAAAASgEbAAUAAAABAAAA..." class="logo-small" alt="Logo">
<div>
<div class="user-name" id="userName">Loading...</div>
<span class="user-role" id="userRole"></span>
</div>
</div>
<button class="btn-logout" onclick="logout()">Keluar</button>
</div>

<div class="nav-tabs">
<div class="tab active" onclick="switchView('absensi')">📱 Absensi</div>
<div class="tab" onclick="switchView('input')">📝 Input</div>
<div class="tab" onclick="switchView('history')">📊 History</div>
<div class="tab" onclick="switchView('tugas')">✅ Tugas</div>
<div class="tab" onclick="switchView('info')">📢 Info</div>
</div>

<div class="container">
<!-- ABSENSI VIEW -->
<div id="absensiView" class="view active">
<div class="card">
<h3 class="card-title">📅 Absensi Hari Ini</h3>
<div id="todayStatus" class="loading">Memuat...</div>
<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
<button class="btn-submit" onclick="openClockIn()" id="clockInBtn" style="flex:1">🟢 CLOCK IN</button>
<button class="btn-submit" onclick="openClockOut()" id="clockOutBtn" style="flex:1;background:#B85C50" disabled>🔴 CLOCK OUT</button>
</div>
</div>
<div class="card">
<h3 class="card-title">📊 Rekap Periode</h3>
<div id="periodSummary" class="loading">Memuat...</div>
</div>
</div>

<!-- INPUT VIEW -->
<div id="inputView" class="view">
<div class="card">
<h3 class="card-title">📝 Input Laporan Harian</h3>
<form id="reportForm" onsubmit="return submitReport(event)">
<div class="form-group">
<label>Tanggal</label>
<input type="date" id="reportDate" required>
</div>
<div class="form-group">
<label>Total Penjualan (Rp)</label>
<input type="number" id="reportAmount" required>
</div>
<div class="form-group">
<label>Jumlah Transaksi</label>
<input type="number" id="reportCount" required>
</div>
<div class="form-group">
<label>Produk Terlaris</label>
<input type="text" id="reportTop">
</div>
<div class="form-group">
<label>Catatan</label>
<textarea id="reportNotes" rows="3"></textarea>
</div>
<button type="submit" class="btn-submit">Simpan Laporan</button>
</form>
</div>
</div>

<!-- HISTORY VIEW -->
<div id="historyView" class="view">
<div class="card">
<h3 class="card-title">📊 Riwayat Absensi</h3>
<div class="filter-row">
<select id="historyPeriod" onchange="toggleDateRange()">
<option value="week">7 Hari</option>
<option value="month" selected>Bulan Ini</option>
<option value="custom">Tanggal Kustom</option>
<option value="all">Semua</option>
</select>
<select id="historyStore" style="display:none">
<option value="all">Semua Toko</option>
</select>
</div>
<div class="date-range" id="dateRange">
<input type="date" id="dateFrom">
<input type="date" id="dateTo">
<button class="btn-submit" onclick="loadHistory()">Filter</button>
</div>
<div id="historyList" class="loading">Memuat...</div>
</div>
</div>

<!-- TUGAS VIEW -->
<div id="tugasView" class="view">
<div class="card">
<h3 class="card-title">✅ Daftar Tugas</h3>
<div id="spvTaskCreate" style="display:none">
<button class="btn-add" onclick="openCreateTask()">+ Buat Tugas Baru</button>
</div>
<div class="filter-row" id="tasksStoreFilterRow" style="display:none">
<select id="tasksStoreFilter" onchange="loadTasks()">
<option value="all">Semua Toko</option>
</select>
</div>
<div id="tasksList" class="loading">Memuat...</div>
</div>
</div>

<!-- INFO VIEW -->
<div id="infoView" class="view">
<div class="card">
<h3 class="card-title">📢 Pengumuman</h3>
<div id="spvAnnouncementCreate" style="display:none">
<button class="btn-add" onclick="openCreateAnnouncement()">+ Buat Pengumuman</button>
</div>
<div id="announcementsList" class="loading">Memuat...</div>
</div>
</div>
</div>

<!-- CAMERA MODAL -->
<div id="cameraModal" class="modal">
<div class="modal-content">
<h3 class="modal-title" id="cameraTitle">📸 Ambil Foto</h3>
<div class="camera-container">
<video id="cameraVideo" autoplay playsinline style="display:block"></video>
<img id="photoPreview" style="display:none">
<canvas id="photoCanvas" style="display:none"></canvas>
</div>
<div class="camera-controls">
<button class="btn-submit" onclick="capturePhoto()" id="captureBtn">📷 Ambil</button>
<button class="btn-submit" onclick="retakePhoto()" id="retakeBtn" style="display:none;background:#D4A574">🔄 Ulang</button>
<button class="btn-submit" onclick="confirmPhoto()" id="confirmBtn" style="display:none;background:#5A8F5A">✅ OK</button>
<button class="modal-close" onclick="closeCameraModal()">Batal</button>
</div>
</div>
</div>

<!-- TASK MODAL -->
<div id="taskModal" class="modal">
<div class="modal-content">
<h3 class="modal-title">📋 Buat Tugas Baru</h3>
<form id="taskForm" onsubmit="return createTask(event)">
<div class="form-group">
<label>Toko</label>
<select id="taskStore" required></select>
</div>
<div class="form-group">
<label>Judul</label>
<input type="text" id="taskTitle" required>
</div>
<div class="form-group">
<label>Deskripsi</label>
<textarea id="taskDesc" rows="3"></textarea>
</div>
<div class="form-group">
<label>Assignee</label>
<input type="text" id="taskAssignee" required>
</div>
<div class="form-group">
<label>Deadline</label>
<input type="date" id="taskDeadline" required>
</div>
<div class="form-group">
<label>Prioritas</label>
<select id="taskPriority">
<option value="Rendah">Rendah</option>
<option value="Sedang" selected>Sedang</option>
<option value="Tinggi">Tinggi</option>
</select>
</div>
<button type="submit" class="btn-submit">Buat Tugas</button>
</form>
<button class="modal-close" onclick="closeTaskModal()">Batal</button>
</div>
</div>

<!-- ANNOUNCEMENT MODAL -->
<div id="announcementModal" class="modal">
<div class="modal-content">
<h3 class="modal-title">📢 Buat Pengumuman</h3>
<form id="announcementForm" onsubmit="return createAnnouncement(event)">
<div class="form-group">
<label>Judul</label>
<input type="text" id="annTitle" required>
</div>
<div class="form-group">
<label>Isi</label>
<textarea id="annContent" rows="4" required></textarea>
</div>
<div class="form-group">
<label>Target</label>
<select id="annTarget" onchange="toggleAnnStore()">
<option value="all">Semua Toko</option>
<option value="specific">Toko Spesifik</option>
</select>
</div>
<div class="form-group" id="annStoreGroup" style="display:none">
<label>Pilih Toko</label>
<select id="annStore"></select>
</div>
<div class="form-group">
<label>Prioritas</label>
<select id="annPriority">
<option value="info">🟢 Info</option>
<option value="normal">🟡 Normal</option>
<option value="urgent">🔴 Urgent (Pop-up)</option>
</select>
</div>
<button type="submit" class="btn-submit">Buat Pengumuman</button>
</form>
<button class="modal-close" onclick="closeAnnouncementModal()">Batal</button>
</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbxNpS2LuNEAwLtTo1KPCxsdabYHvrKzOkTVqNiOCjQqSJsy_xHOLuoOmbBu0jW_b-7K/exec";
const user=JSON.parse(localStorage.getItem('user')||'null');
const isSPV=user&&user.isSPV;
let cameraStream=null;
let currentPhoto=null;
let clockAction=null;
let currentTaskId=null;

if(!user){window.location.href='index.html'}

document.getElementById('userName').textContent=user.name;
document.getElementById('userRole').textContent=user.role+' - '+user.storeName;

if(isSPV){
document.getElementById('spvTaskCreate').style.display='block';
document.getElementById('spvAnnouncementCreate').style.display='block';
document.getElementById('tasksStoreFilterRow').style.display='flex';
document.getElementById('historyStore').style.display='block';
}else if(user.role==='Manager'||user.role==='Admin'){
document.getElementById('spvTaskCreate').style.display='block';
}

async function api(action,sheet,data){
try{
const method=data?'POST':'GET';
const url=API+'?action='+action+'&sheet='+sheet;
const opts={method:method};
if(data)opts.body=JSON.stringify(data);
const r=await fetch(url,opts);
return await r.json();
}catch(e){
return{success:false,error:e.message};
}
}

function switchView(view){
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.getElementById(view+'View').classList.add('active');
event.target.classList.add('active');

if(view==='absensi')loadAbsensi();
if(view==='history')loadHistory();
if(view==='tugas')loadTasks();
if(view==='info')loadAnnouncements();
}

function logout(){
localStorage.removeItem('user');
window.location.href='index.html';
}

// ABSENSI FUNCTIONS
async function loadAbsensi(){
const today=new Date().toISOString().split('T')[0];
const r=await api('read','Attendance');
if(!r.success)return;

const todayRecord=(r.data||[]).find(a=>a.userId===user.id&&a.date===today);
const statusDiv=document.getElementById('todayStatus');
const clockInBtn=document.getElementById('clockInBtn');
const clockOutBtn=document.getElementById('clockOutBtn');

if(!todayRecord){
statusDiv.innerHTML='<p style="color:#888">Belum clock in hari ini</p>';
clockInBtn.disabled=false;
clockOutBtn.disabled=true;
}else if(todayRecord.clockIn&&!todayRecord.clockOut){
statusDiv.innerHTML='<p>✅ Clock In: '+todayRecord.clockIn+'</p><p style="color:#888">Belum clock out</p>';
clockInBtn.disabled=true;
clockOutBtn.disabled=false;
}else{
statusDiv.innerHTML='<p>✅ Clock In: '+todayRecord.clockIn+'</p><p>✅ Clock Out: '+todayRecord.clockOut+'</p><p>⏱️ '+todayRecord.workHours+'</p>';
clockInBtn.disabled=true;
clockOutBtn.disabled=true;
}

loadPeriodSummary(r.data||[]);
}

function loadPeriodSummary(allData){
const period=getCurrentPeriod();
const myData=allData.filter(a=>a.userId===user.id&&a.date>=period.start&&a.date<=period.end);
const completed=myData.filter(a=>a.status==='completed').length;

document.getElementById('periodSummary').innerHTML='<p>Periode: '+period.start+' s/d '+period.end+'</p><p>Hadir: '+completed+' hari</p><p>Total: '+myData.length+' hari</p>';
}

function getCurrentPeriod(){
const today=new Date();
const day=today.getDate();
let start,end;

if(day<26){
const lastMonth=new Date(today.getFullYear(),today.getMonth()-1,26);
start=lastMonth.toISOString().split('T')[0];
end=new Date(today.getFullYear(),today.getMonth(),25).toISOString().split('T')[0];
}else{
start=new Date(today.getFullYear(),today.getMonth(),26).toISOString().split('T')[0];
end=new Date(today.getFullYear(),today.getMonth()+1,25).toISOString().split('T')[0];
}

return{start,end};
}

function openClockIn(){
clockAction='clockIn';
document.getElementById('cameraTitle').textContent='📸 Foto Clock In';
openCameraModal();
}

function openClockOut(){
clockAction='clockOut';
document.getElementById('cameraTitle').textContent='📸 Foto Clock Out';
openCameraModal();
}

async function openCameraModal(){
document.getElementById('cameraModal').classList.add('active');
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
cameraStream=stream;
document.getElementById('cameraVideo').srcObject=stream;
}catch(e){
alert('Tidak dapat akses kamera: '+e.message);
closeCameraModal();
}
}

function closeCameraModal(){
if(cameraStream){
cameraStream.getTracks().forEach(t=>t.stop());
cameraStream=null;
}
document.getElementById('cameraModal').classList.remove('active');
document.getElementById('cameraVideo').style.display='block';
document.getElementById('photoPreview').style.display='none';
document.getElementById('captureBtn').style.display='inline-block';
document.getElementById('retakeBtn').style.display='none';
document.getElementById('confirmBtn').style.display='none';
currentPhoto=null;
}

function capturePhoto(){
const video=document.getElementById('cameraVideo');
const canvas=document.getElementById('photoCanvas');
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
canvas.getContext('2d').drawImage(video,0,0);
currentPhoto=canvas.toDataURL('image/jpeg',0.8);

document.getElementById('photoPreview').src=currentPhoto;
document.getElementById('cameraVideo').style.display='none';
document.getElementById('photoPreview').style.display='block';
document.getElementById('captureBtn').style.display='none';
document.getElementById('retakeBtn').style.display='inline-block';
document.getElementById('confirmBtn').style.display='inline-block';
}

function retakePhoto(){
document.getElementById('cameraVideo').style.display='block';
document.getElementById('photoPreview').style.display='none';
document.getElementById('captureBtn').style.display='inline-block';
document.getElementById('retakeBtn').style.display='none';
document.getElementById('confirmBtn').style.display='none';
currentPhoto=null;
}

async function confirmPhoto(){
if(!currentPhoto){
alert('Ambil foto terlebih dahulu');
return;
}

try{
const r=await fetch(API+'?action='+clockAction,{
method:'POST',
body:JSON.stringify({
userId:user.id,
userName:user.name,
storeId:user.storeId,
storeName:user.storeName,
photoData:currentPhoto
})
});
const rs=await r.json();

if(rs.success){
alert('✅ '+rs.message);
closeCameraModal();
loadAbsensi();
}else{
alert('❌ '+rs.error);
}
}catch(e){
alert('Error: '+e.message);
}
}

// INPUT FUNCTIONS
document.getElementById('reportDate').valueAsDate=new Date();

async function submitReport(e){
e.preventDefault();
const data={
id:Date.now().toString(),
storeId:user.storeId,
storeName:user.storeName,
reportBy:user.name,
date:document.getElementById('reportDate').value,
amount:document.getElementById('reportAmount').value,
transactionCount:document.getElementById('reportCount').value,
topProduct:document.getElementById('reportTop').value,
notes:document.getElementById('reportNotes').value,
createdAt:new Date().toISOString()
};

const r=await api('write','SalesReports',data);
if(r.success){
alert('✅ Laporan tersimpan!');
document.getElementById('reportForm').reset();
document.getElementById('reportDate').valueAsDate=new Date();
}else{
alert('❌ '+r.error);
}
return false;
}

// HISTORY FUNCTIONS
function toggleDateRange(){
const period=document.getElementById('historyPeriod').value;
const dateRange=document.getElementById('dateRange');
if(period==='custom'){
dateRange.classList.add('active');
}else{
dateRange.classList.remove('active');
loadHistory();
}
}

async function loadHistory(){
const period=document.getElementById('historyPeriod').value;
const r=await api('read','Attendance');
if(!r.success){
document.getElementById('historyList').innerHTML='<div class="empty-state">Gagal memuat data</div>';
return;
}

let data=r.data||[];

// Filter by role
if(isSPV){
const storeFilter=document.getElementById('historyStore').value;
if(storeFilter!=='all'){
data=data.filter(a=>a.storeId===storeFilter);
}
}else if(user.role==='Manager'){
data=data.filter(a=>a.storeId===user.storeId);
}else{
data=data.filter(a=>a.userId===user.id);
}

// Filter by period
const now=new Date();
if(period==='week'){
const weekAgo=new Date(now-7*24*60*60*1000).toISOString().split('T')[0];
data=data.filter(a=>a.date>=weekAgo);
}else if(period==='month'){
const monthStart=new Date(now.getFullYear(),now.getMonth(),1).toISOString().split('T')[0];
data=data.filter(a=>a.date>=monthStart);
}else if(period==='custom'){
const from=document.getElementById('dateFrom').value;
const to=document.getElementById('dateTo').value;
if(from&&to){
data=data.filter(a=>a.date>=from&&a.date<=to);
}
}

data.sort((a,b)=>b.date.localeCompare(a.date));

if(data.length===0){
document.getElementById('historyList').innerHTML='<div class="empty-state">Tidak ada data</div>';
return;
}

const html=data.map(a=>`
<div class="task-item">
<div style="display:flex;justify-content:space-between;align-items:start">
<div>
<div class="task-title">${a.userName} - ${a.date}</div>
<div class="task-meta">
Clock In: ${a.clockIn||'-'} | Clock Out: ${a.clockOut||'-'}
${a.workHours?'<br>Durasi: '+a.workHours:''}
</div>
</div>
<span style="padding:4px 8px;background:#5A8F5A;color:#fff;border-radius:4px;font-size:11px">
${a.status==='completed'?'✅ Selesai':'⏳ Aktif'}
</span>
</div>
</div>
`).join('');

document.getElementById('historyList').innerHTML=html;
}

// TASKS FUNCTIONS
async function loadTasks(){
const filter=isSPV?document.getElementById('tasksStoreFilter').value:null;
const r=await api('read','Tasks');
if(!r.success)return;

let tasks=r.data||[];

if(isSPV&&filter!=='all'){
tasks=tasks.filter(t=>t.storeId===filter);
}else if(isSPV){
tasks=tasks.filter(t=>t.storeId!=='9999');
}else if(user.role==='Admin'||user.role==='Manager'){
const subordinateRoles=['Shift Leader','Head Cook','Staff'];
tasks=tasks.filter(t=>{
if(t.storeId!==user.storeId)return false;
if(t.assignee.toLowerCase()===user.name.toLowerCase())return true;
const roleMap=JSON.parse(localStorage.getItem('userRoleMap')||'{}');
const assigneeRole=(roleMap[t.assignee.toLowerCase()]||{}).role||'Staff';
return subordinateRoles.includes(assigneeRole);
});
}else{
tasks=tasks.filter(t=>t.storeId===user.storeId&&t.assignee.toLowerCase()===user.name.toLowerCase());
}

tasks.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));

if(tasks.length===0){
document.getElementById('tasksList').innerHTML='<div class="empty-state">Tidak ada tugas</div>';
return;
}

const html=tasks.map(t=>`
<div class="task-item">
<div style="display:flex;gap:10px;align-items:start">
${t.status!=='done'?'<input type="checkbox" onchange="completeTask(''+t.id+'',''+t.storeName+'',''+t.title+'')">':'<span style="color:#5A8F5A">✅</span>'}
<div style="flex:1">
<div class="task-title">${t.title}</div>
<div class="task-meta">
📅 ${t.deadline} • 👤 ${t.assignee}
${t.proofPhoto?'<br>📸 <a href="'+t.proofPhoto+'" target="_blank">Lihat Foto</a>':''}
</div>
</div>
</div>
</div>
`).join('');

document.getElementById('tasksList').innerHTML=html;
}

function completeTask(taskId,storeName,taskTitle){
currentTaskId=taskId;
document.getElementById('cameraTitle').textContent='📸 Foto Bukti Tugas';
clockAction='taskComplete';
window.taskStoreName=storeName;
window.taskTitle=taskTitle;
openCameraModal();
}

async function confirmPhoto(){
if(clockAction==='taskComplete'){
if(!currentPhoto){
alert('Foto bukti wajib!');
return;
}

try{
const r=await fetch(API+'?action=uploadTaskPhoto',{
method:'POST',
body:JSON.stringify({
taskId:currentTaskId,
photoData:currentPhoto,
storeName:window.taskStoreName,
taskTitle:window.taskTitle,
completedBy:user.name
})
});
const rs=await r.json();

if(rs.success){
alert('✅ Tugas selesai!');
closeCameraModal();
loadTasks();
}else{
alert('❌ '+rs.error);
}
}catch(e){
alert('Error: '+e.message);
}
return;
}

// For attendance
if(!currentPhoto){
alert('Ambil foto terlebih dahulu');
return;
}

try{
const r=await fetch(API+'?action='+clockAction,{
method:'POST',
body:JSON.stringify({
userId:user.id,
userName:user.name,
storeId:user.storeId,
storeName:user.storeName,
photoData:currentPhoto
})
});
const rs=await r.json();

if(rs.success){
alert('✅ '+rs.message);
closeCameraModal();
loadAbsensi();
}else{
alert('❌ '+rs.error);
}
}catch(e){
alert('Error: '+e.message);
}
}

function closeTaskModal(){

}

async function createTask(e){
e.preventDefault();
const storeId=document.getElementById('taskStore').value;
const stores=await api('read','Stores');
const store=(stores.data||[]).find(s=>s.id===storeId);

const data={
id:Date.now().toString(),
storeId:storeId,
storeName:store?store.name:'',
title:document.getElementById('taskTitle').value,
description:document.getElementById('taskDesc').value,
assignee:document.getElementById('taskAssignee').value,
deadline:document.getElementById('taskDeadline').value,
priority:document.getElementById('taskPriority').value,
status:'pending',
createdAt:new Date().toISOString()
};

const r=await api('write','Tasks',data);

}else{

}

});

</div>
<div class="announcement-content">${a.content}</div>
<div class="announcement-meta">
📅 ${new Date(a.createdAt).toLocaleDateString('id-ID')} •

}
